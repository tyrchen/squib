[package]
name = "squib-vmm"
description = "Squib VMM core: builder, vCPU thread, device manager, event loop"
categories = ["virtualization"]
keywords = ["vmm", "microvm", "firecracker", "aarch64"]
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
applevisor = { workspace = true }

[dependencies]
# `criterion` is keyed off the optional `bench` feature so a plain
# `cargo test -p squib-vmm` does NOT pull it in. Same pattern as
# `crates/snapshot/Cargo.toml`; see the comment there.
criterion = { workspace = true, optional = true }
parking_lot = { workspace = true }
squib-arch = { workspace = true }
squib-bus = { workspace = true }
squib-core = { workspace = true }
squib-fdt = { workspace = true }
squib-gic = { workspace = true }
squib-hv = { workspace = true }
squib-legacy = { workspace = true }
squib-loader = { workspace = true }
squib-mmds = { workspace = true }
squib-net = { workspace = true }
squib-virtio = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = []
bench = ["dep:criterion"]

[[bench]]
name = "boot"
harness = false
required-features = ["bench"]
