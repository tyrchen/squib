[package]
name = "squib-host"
description = "macOS host-side primitives for squib (Mach-exception-port pager backing postcopy / lazy-restore)"
categories = ["virtualization"]
keywords = ["macos", "mach", "hvf", "postcopy", "snapshot"]
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Enables the live `mach_msg(MACH_RCV_MSG)` server in `pager::mach_imp`. Off by
# default because installing a process-level exception port requires the
# operator to understand they're hijacking the macOS exception delivery path —
# unprivileged unit-test runs default to the skeleton (drift-poll only) shape.
pager-live-mach = ["dep:mach2"]

[dependencies]
squib-snapshot = { workspace = true }

bytes = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Live Mach exception-port server. Optional — enabled via the
# `pager-live-mach` feature.
mach2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
