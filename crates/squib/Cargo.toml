[package]
name = "squib"
description = "Embeddable facade for Squib microVM runtimes"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Enable the bridged-mode codepath in `squib-net`. Pair CLI builds with the
# `apps/squib-cli/squib-bridged.entitlements` plist and the `make sign-bridged`
# target. Per [30-networking.md § 5] and D17.
bridged = ["squib-net/bridged"]

[dependencies]
squib-api = { workspace = true }
squib-arch = { workspace = true }
squib-bus = { workspace = true }
squib-core = { workspace = true }
squib-fdt = { workspace = true }
squib-gic = { workspace = true }
squib-hv = { workspace = true }
squib-legacy = { workspace = true }
squib-mmds = { workspace = true }
squib-net = { workspace = true }
squib-virtio = { workspace = true }
squib-vmm = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
