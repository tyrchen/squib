[package]
name = "squib-snapshot"
description = "Squib snapshot subsystem: bitcode state file, sparse memory file, dirty-page tracking"
categories = ["virtualization"]
keywords = ["snapshot", "firecracker", "microvm", "hvf", "aarch64"]
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
squib-arch = { workspace = true }
squib-core = { workspace = true }

bitcode = { workspace = true }
# `criterion` is keyed off the optional `bench` feature so a plain
# `cargo test -p squib-snapshot` does NOT pull it in (the previous shape kept
# it as an unconditional dev-dependency, which dragged ~30 transitive crates
# into every developer's `cargo build` even when nobody was running benches).
# Per `93-improvements-review.md` § "Phase 7 deferred"; the finding is exactly
# the `optional = true + dep:criterion` pattern below.
criterion = { workspace = true, optional = true }
crc64 = { workspace = true }
parking_lot = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
# Pulls criterion in as a normal dependency. Required for the `[[bench]]`
# target and any consumer that wants to drive the benches programmatically.
bench = ["dep:criterion"]

[[bench]]
name = "dirty_bitmap"
harness = false
required-features = ["bench"]
