[workspace]
members = ["crates/*", "apps/*", "tests/firecracker-compat"]
resolver = "3"

[workspace.package]
version = "0.2.0"
authors = ["Tyr Chen <tyr.chen@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
documentation = "https://docs.rs/squib-core"
repository = "https://github.com/tyrchen/squib"
homepage = "https://github.com/tyrchen/squib"
readme = "README.md"
rust-version = "1.95"

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2024_compatibility = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
# error / async core
anyhow = "1.0.102"
thiserror = "2.0.18"
tokio = { version = "1.52", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "sync",
  "fs",
  "io-util",
  "time",
  "signal",
  "process",
] }

# serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "fmt",
  "json",
] }

# CLI
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }

# data
bytes = "1.11"
parking_lot = "0.12"
smallvec = { version = "1.15", features = ["serde", "union"] }
arc-swap = "1.9"


# HTTP server (squib-api)
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "matched-path",
  "tokio",
] }
http = "1.4"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["set-header", "trace", "limit"] }

# raw HTTP parsing for integration tests
httparse = "1.10"

# rust-vmm
vm-fdt = "0.3"
linux-loader = { version = "0.13", default-features = false, features = ["pe"] }

# kernel image compression
flate2 = "1"
zstd = "0.13"

# parsing
winnow = "1"

# semver carried inside the snapshot envelope (10-data-model § 6.1)
semver = { version = "1", features = ["serde"] }

# Snapshot envelope encoding — bitcode + the same CRC64 crate Firecracker uses
# (vendors/firecracker/Cargo.toml — `crc64`). Pinning to the exact upstream crate
# keeps the on-disk byte format byte-identical with `firecracker --describe-snapshot`.
bitcode = { version = "0.6", features = ["serde"] }
crc64 = "2"

# HVF binding — see 12-hvf-backend.md § 1 and D2 for the macOS-15-0 feature rationale.
# `default-features = false` is mandatory: applevisor's `default = ["macos-26-0"]` would
# pull in macOS 26 symbols and fail at runtime on macOS 15.
applevisor = { version = "1.0", default-features = false, features = [
  "macos-15-0",
] }

# `libc` — needed by squib-net for `socketpair(2)` plumbing into gvproxy
# and by the vmnet FFI for `iovec` shape.
libc = "0.2"

# Apple Block ABI shim. Used by squib-net to construct the callback blocks
# `vmnet.framework` consumes. Maintained by the objc2 ecosystem.
block2 = "0.6"

# Mach 3.0 syscall bindings. squib-host's `pager-live-mach` feature uses these
# to install a process-level exception port and serve `MACH_RCV_MSG` for
# postcopy lazy-fault-in. Pinned to 0.6 because the 0.4 series is missing the
# `task_swap_exception_ports` / `task_get_exception_ports` bindings squib needs.
mach2 = "0.6.0"

# URL-safe base64 (no padding). Used by squib-mmds for the V2 token wire form
# and by future consumers needing RFC-4648 § 5 encodings.
base64 = { version = "0.22", default-features = false, features = ["std"] }

# RFC-4122 UUIDs. squib-net uses `Uuid::new_v5` over a name-spaced derivation
# of `iface_id` for the vmnet `interface_id_key`; squib-host's `pager-live-mach`
# feature uses `Uuid::new_v4` for the postcopy snapshot identifier passed to
# the launcher. Pulling in `uuid` is one workspace dep with two consumers, so
# the `61-crates-and-features.md § 4` "wait for a second consumer" gate is met.
uuid = { version = "1", default-features = false, features = ["v5", "std"] }

# benchmarking
criterion = { version = "0.8", default-features = false, features = [
  "html_reports",
] }

# test scaffolding — atomic-rename and pager tests need throwaway files
tempfile = "3.27"

# workspace crates
squib = { version = "0.2.0", path = "crates/squib" }
squib-core = { version = "0.2.0", path = "crates/core" }
squib-api = { version = "0.2.0", path = "crates/api" }
squib-arch = { version = "0.2.0", path = "crates/arch" }
squib-fdt = { version = "0.2.0", path = "crates/fdt" }
squib-loader = { version = "0.2.0", path = "crates/loader" }
squib-hv = { version = "0.2.0", path = "crates/hv" }
squib-gic = { version = "0.2.0", path = "crates/gic" }
squib-vmm = { version = "0.2.0", path = "crates/vmm" }
squib-bus = { version = "0.2.0", path = "crates/bus" }
squib-virtio = { version = "0.2.0", path = "crates/virtio" }
squib-mmds = { version = "0.2.0", path = "crates/mmds" }
squib-legacy = { version = "0.2.0", path = "crates/legacy" }
squib-net = { version = "0.2.0", path = "crates/net" }
squib-snapshot = { version = "0.2.0", path = "crates/snapshot" }
squib-host = { version = "0.2.0", path = "crates/host" }
